[project.scripts]
mmp = "app.main:run_application"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
  "cython~=3.3.0",
  "pytest~=9.1.1",
  "pytest-asyncio~=1.4.0",
  "pytest-cov~=7.1.0",
  "pytest-timeout~=2.4.0",
  "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
timeout_method = "thread"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
# 仅对「无法在本仓修复根因」的已知上游/三方弃用告警做精确忽略，保持测试输出干净、
# 让本仓自身的新告警更醒目。本仓代码引发的告警一律不在此忽略，应在源码/用例处修复。
filterwarnings = [
  "ignore:datetime.datetime.utcfromtimestamp\\(\\) is deprecated:DeprecationWarning",
  "ignore:'crypt' is deprecated:DeprecationWarning",
  "ignore:'audioop' is deprecated:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/plugins/*/*", "app/testing/*", "app/helper/sites.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 2
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "pass",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.json]
output = "coverage.json"

[tool.ruff]
target-version = "py314"
line-length = 135
indent-width = 4

exclude = [
  ".git",
  "__pycache__",
  ".venv",
  "build",
  "dist",
  "tests",
  "docs",
  "app/plugins",
  "skill",
  "scripts",
]

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # pyflakes
  "I", # isort
  "B", # flake8-bugbear
  "C4", # flake8-comprehensions
  "UP", # pyupgrade
  "PERF", # Perflint
  "TC", # flake8-type-checking
]

ignore = ["F401", "E501", "F403"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Security",
  "fastapi.Body",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Query",
  "fastapi.Path",
]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "auto"
